name = "zerovisual-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "EmoteRoom"

[[durable_objects.bindings]]
name = "LINKS"
class_name = "PlayerLink"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EmoteRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PlayerLink"]

