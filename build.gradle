plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mod Menu
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

loom {
	accessWidenerPath = file('src/main/resources/zerovisual.accesswidener')
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API (required)
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Mod Menu (optional integration; present in dev runtime)
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version
	filteringCharset = 'UTF-8'

	filesMatching('fabric.mod.json') {
		expand 'version': project.version,
			'minecraft_version': project.minecraft_version,
			'loader_version': project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Builds the mod and copies it into a launcher instance's mods folder.
// Default: Lexplosion instance "zerovisual test". Override: -PdeployDir="C:/path/to/mods"
tasks.register('deployToLauncher') {
	group = 'zerovisual'
	description = 'Builds the mod and copies the jar into the launcher mods folder'
	dependsOn remapJar

	def modsDir = file(project.findProperty('deployDir')
		?: "${System.getenv('APPDATA')}/.lexplosion/instances/zerovisual test/mods")
	def modJar = remapJar.archiveFile
	def baseName = project.base.archivesName

	doLast {
		modsDir.mkdirs()
		modsDir.listFiles({ f -> f.name ==~ /${baseName.get()}-.*\.jar/ } as FileFilter)?.each { it.delete() }
		copy {
			from modJar
			into modsDir
		}
		logger.lifecycle("Deployed ${modJar.get().asFile.name} -> ${modsDir}")
	}
}
