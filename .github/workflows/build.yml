name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: '1.21.4'
            java: '21'
          # Loom needs Java 25 to run, the mod itself is compiled for Java 21
          - project: '1.21.11'
            java: |
              21
              25
          - project: '26.3'
            java: '25'
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: zerovisual-${{ matrix.project }}
          path: ${{ matrix.project }}/build/libs/
