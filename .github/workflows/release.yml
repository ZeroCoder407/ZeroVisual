name: release

# Push a tag like v0.2.0 (it must match mod_version in gradle.properties).
# Builds the signed jar and creates a draft release with the jar, its SHA-256 and build provenance.
# Requires the repository secret ZV_SIGNING_KEY (the zvSigningKey value from your ~/.gradle/gradle.properties).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Check the tag matches the mod version
        run: |
          version=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version"; exit 1
          fi

      - name: Build and sign
        env:
          ZV_SIGNING_KEY: ${{ secrets.ZV_SIGNING_KEY }}
        run: |
          chmod +x ./gradlew
          if [ -z "$ZV_SIGNING_KEY" ]; then echo "::error::The ZV_SIGNING_KEY secret is empty or missing"; exit 1; fi
          echo "::notice::Signing key length: ${#ZV_SIGNING_KEY}"
          if ! ./gradlew build > gradle.log 2>&1; then
            echo "::error::Gradle build failed: $(grep -E 'Exception|What went wrong' -A3 gradle.log | head -c 900 | tr '\n' ' ')"
            exit 1
          fi
          grep -E 'Signed|unsigned' gradle.log || true
          jar=$(ls build/libs/zerovisual-*.jar | grep -v sources)
          # no pipe into grep -q: with pipefail the early exit of grep fails the whole check
          unzip -l "$jar" META-INF/zerovisual.sig > /dev/null || { echo "The jar is not signed: is ZV_SIGNING_KEY set?"; exit 1; }
          sha256sum "$jar" | sed 's|build/libs/||' > "$jar.sha256"
          echo "JAR=$jar" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.JAR }}

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ env.JAR }}
            ${{ env.JAR }}.sha256
