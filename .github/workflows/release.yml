name: release

# Push a tag like v0.2.1 (it must match mod_version in gradle.properties).
# Builds the signed jar, creates a draft GitHub release with the jar, its SHA-256 and build provenance,
# and publishes the same jar to Modrinth and CurseForge.
#
# Repository secrets:   ZV_SIGNING_KEY (required), MODRINTH_TOKEN, CURSEFORGE_TOKEN
# Repository variables: MODRINTH_PROJECT_ID, CURSEFORGE_PROJECT_ID
# A store is skipped while its token or project id is not set.
# The changelog is the section of CHANGELOG.md for this version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      PUBLISH_MODRINTH: ${{ secrets.MODRINTH_TOKEN != '' && vars.MODRINTH_PROJECT_ID != '' }}
      PUBLISH_CURSEFORGE: ${{ secrets.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Check the tag matches the mod version
        run: |
          version=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Changelog for this version
        run: |
          # the lines under "## <version>" up to the next "## "
          awk -v v="## $VERSION" '$0 == v {found=1; next} /^## / {if (found) exit} found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "::warning::No CHANGELOG.md section for $VERSION"; echo "ZeroVisual $VERSION" > release-notes.md; fi

      - name: Build and sign
        env:
          ZV_SIGNING_KEY: ${{ secrets.ZV_SIGNING_KEY }}
        run: |
          chmod +x ./gradlew
          if [ -z "$ZV_SIGNING_KEY" ]; then echo "::error::The ZV_SIGNING_KEY secret is empty or missing"; exit 1; fi
          echo "::notice::Signing key length: ${#ZV_SIGNING_KEY}"
          if ! ./gradlew build > gradle.log 2>&1; then
            echo "::error::Gradle build failed: $(grep -E 'Exception|What went wrong' -A3 gradle.log | head -c 900 | tr '\n' ' ')"
            exit 1
          fi
          grep -E 'Signed|unsigned' gradle.log || true
          jar=$(ls build/libs/zerovisual-*.jar | grep -v sources)
          # no pipe into grep -q: with pipefail the early exit of grep fails the whole check
          unzip -l "$jar" META-INF/zerovisual.sig > /dev/null || { echo "The jar is not signed: is ZV_SIGNING_KEY set?"; exit 1; }
          sha256sum "$jar" | sed 's|build/libs/||' > "$jar.sha256"
          echo "JAR=$jar" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.JAR }}

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: |
            ${{ env.JAR }}
            ${{ env.JAR }}.sha256

      - name: Publish to Modrinth
        if: env.PUBLISH_MODRINTH == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ env.JAR }}
          name: ZeroVisual ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: release
          changelog-file: release-notes.md
          loaders: fabric
          game-versions: 1.21.4
          java: 21
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            modmenu(optional){modrinth:mOgUt4GM}

      - name: Publish to CurseForge
        if: env.PUBLISH_CURSEFORGE == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.JAR }}
          name: ZeroVisual ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: release
          changelog-file: release-notes.md
          loaders: fabric
          game-versions: 1.21.4
          java: 21
          dependencies: |
            fabric-api(required){curseforge:306612}
            modmenu(optional){curseforge:308702}
