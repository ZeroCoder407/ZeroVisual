pluginManagement {
	repositories {
		// Essential first: it holds the Loom fork and mirrors what it needs from maven.fabricmc.net, which does not answer from here
		maven { url = 'https://repo.essential.gg/repository/maven-public/' }
		mavenCentral()
		gradlePluginPortal()
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.minecraftforge.net/' }
		maven { url = 'https://repo.spongepowered.org/maven/' }
	}
	resolutionStrategy {
		eachPlugin {
			// Essential's fork of architectury-loom, the one that still builds Forge 1.8.9
			if (requested.id.id == 'gg.essential.loom') useModule("gg.essential:architectury-loom:${requested.version}")
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'zerovisual'
